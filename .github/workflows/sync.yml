name: Sync to Backup

on:
  push:
    branches:
      - main

jobs:
  git-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN }}

      - name: Push to Mirror
        run: |
          git config --global user.name "stephane0254-png"
          git config --global user.email "robot@github.com"
          git remote add mirror https://x-access-token:${{ secrets.SYNC_TOKEN }}@github.com/stephane0254-png/Congelateur_Maman.git
          git push --force --prune mirror "refs/remotes/origin/*:refs/heads/*"
